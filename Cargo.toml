[package]
name = "spacelens-rust"
version = "3.6.1"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "spacelens"

[[bin]]
name = "SpaceLens_Rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
unicode-casefold = "0.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_IO", "Win32_System_Ioctl"] }
windows-core = "0.62"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

